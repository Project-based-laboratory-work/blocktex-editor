name: frontend

# CONTRIBUTING.md の「mainへの直接pushは禁止・PR経由でマージ」を機械的に担保するため、
# PRとmainへのpushで lint / フォーマット / テスト / ビルドを通す。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
