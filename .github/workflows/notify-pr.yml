name: Notify PR to Teams

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  notify:
    # draftの間は通知しない（Ready for reviewにした時点で ready_for_review で通知される）
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL が未設定のため通知をスキップします"
            exit 0
          fi

          payload=$(jq -n \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            --arg files "$PR_FILES" \
            --arg additions "$PR_ADDITIONS" \
            --arg deletions "$PR_DELETIONS" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    {type: "TextBlock", text: "新しいPull Request #\($number)", weight: "Bolder", size: "Medium"},
                    {type: "TextBlock", text: $title, wrap: true},
                    {type: "FactSet", facts: [
                      {title: "作成者", value: $author},
                      {title: "ブランチ", value: "\($head) → \($base)"},
                      {title: "変更", value: "\($files) files (+\($additions) / -\($deletions))"}
                    ]}
                  ],
                  actions: [{type: "Action.OpenUrl", title: "PRを開く", url: $url}]
                }
              }]
            }')

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$TEAMS_WEBHOOK_URL"
